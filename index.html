<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Dikshu</title>
<style>
  @keyframes bgAnimation {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(-45deg, #ff9aa2, #ffb7b2, #ffdac1, #e2f0cb, #b5ead7);
    background-size: 400% 400%;
    animation: bgAnimation 15s ease infinite;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
  }

  .floating {
    position: absolute;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    animation: floatUp linear forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(100vh) rotate(0deg);
      opacity: 0;
    }
    30% {opacity: 1;}
    100% {
      transform: translateY(-20vh) rotate(360deg);
      opacity: 0;
    }
  }

  .heart {
    position: absolute;
    animation: heartFloat linear forwards;
    pointer-events: none;
  }
  @keyframes heartFloat {
    0% {
      transform: translateY(100vh) scale(0.5) rotate(0deg);
      opacity: 0.5;
    }
    50% {opacity: 1;}
    100% {
      transform: translateY(-10vh) scale(1.3) rotate(360deg);
      opacity: 0;
    }
  }

  .gallery {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 210px;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    z-index: 10;
  }
  .gallery img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }
  .gallery img.active {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="gallery">
  <img src="pic1.jpg" alt="Dikshu 1" class="active">
  <img src="pic2.jpg" alt="Dikshu 2">
  <img src="pic3.jpg" alt="Dikshu 3">
</div>

<script>
  const textColors = ['#ffffff','#ffe6f2','#ffccdd','#ff99bb','#ff66aa','#ff3399'];
  const hearts = ['❤️','💖','💘','💕','💓','💞','💗','💝','💜'];

  function createFloatingText() {
    let el = document.createElement('div');
    el.className = 'floating';
    el.innerHTML = '❤️ I Love You Dikshu ❤️';
    el.style.left = Math.random() * window.innerWidth + 'px';
    el.style.top = Math.random() * window.innerHeight + 'px';
    el.style.fontSize = (1 + Math.random() * 1.5) + 'em';
    el.style.color = textColors[Math.floor(Math.random()*textColors.length)];
    el.style.animationDuration = (6 + Math.random() * 6) + 's';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),12000);
  }

  function createHeart() {
    let heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = Math.random() * window.innerHeight + 'px';
    heart.style.fontSize = (1 + Math.random() * 3) + 'em';
    heart.style.animationDuration = (5 + Math.random() * 7) + 's';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),12000);
  }

  // initial fill
  for(let i=0;i<40;i++){createFloatingText();}
  for(let i=0;i<30;i++){createHeart();}

  // keep spawning slowly so it stays full but not bulk
  setInterval(createFloatingText, 400); // new text every 0.4s
  setInterval(createHeart, 600); // new heart every 0.6s

  // fade gallery JS
  const imgs = document.querySelectorAll('.gallery img');
  let idx = 0;
  setInterval(() => {
    imgs[idx].classList.remove('active');
    idx = (idx + 1) % imgs.length;
    imgs[idx].classList.add('active');
  }, 4000);
</script>

</body>
</html>
